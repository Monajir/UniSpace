spring.application.name=UniSpace
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
spring.data.redis.repositories.enabled=false
app.classroom-cache.enabled=${CLASSROOM_CACHE_ENABLED:false}
app.classroom-cache.ttl=${CLASSROOM_CACHE_TTL:60s}
# Redis is an optional acceleration layer, not a readiness dependency.
management.health.redis.enabled=false

server.port=${SERVER_PORT:8082}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/unispace}
spring.datasource.username=${DATABASE_USERNAME:unispace}
spring.datasource.password=${DATABASE_PASSWORD:unispace}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8081}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

app.demo-admin.email=${DEMO_ADMIN_EMAIL:admin@iut-dhaka.edu}
app.demo-admin.password=${DEMO_ADMIN_PASSWORD:admin12345}
app.demo-admin.name=${DEMO_ADMIN_NAME:Demo Administrator}
